<!DOCTYPE html>
<html lang="ko">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <link rel="stylesheet" href="/admin/css/style.css">

</head>

<body>

    <!-- =========================================
        Header
    ========================================== -->

    <header class="header">

        <div class="inner">

            <h1 class="logo">
                <a href="#">

            <nav class="gnb">

    <!-- =========================================
        Main
    ========================================== -->

    <main class="container">

        <!-- Page Title -->

        <section class="page">

            <div class="page-title">

                <div class="title-left">

                    <img src="/admin/images/icon_popup.png" alt="" class="title-icon">

                    <h2>가맹문의관리</h2>

            </div>


            <!-- Form -->

            <form>

                <div class="form-table">

                    <table>

                        <colgroup>

                            <col style="width:190px;">
                            <col>

                        </colgroup>

                        <tbody>

                            <tr>
                                <th>이름</th>
                                <td>홍길동</td>
                            </tr>

                            <tr>
                                <th>연락처</th>
                                <td>0101-1234-5678</td>
                            </tr>                            

                            <tr>
                                <th>창업 희망지역</th>
                                <td>수원</td>
                            </tr>

                            </tr>

                            <tr>
                                <th>상담메모</th>

                                </td>
                            </tr>

                            <!-- 상태 -->

                            <tr>

                                <th>상태</th>

                                <td>
                                    	
                                    <select class="form-select">

                                        <option value="미확인">미확인</option>
                                        <option value="상담중">상담중</option>
                                        <option value="상담완료">상담완료</option>

                                    </select>

                                </td>

                            </tr>                           

                        </tbody>

                    </table>

                </div>

                <!-- Bottom -->

                <div class="form-btn">

                    <button
                        type="button"
                        class="btn btn-gray">

                        목록

                    </button>

                    <button
                        type="button"
                        class="btn btn-gray">

                        삭제

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        수정

                    </button>

                </div>

            </form>
