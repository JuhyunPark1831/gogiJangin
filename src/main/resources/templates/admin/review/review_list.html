<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title></title>

    <link rel="stylesheet" href="/admin/css/style.css">

</head>

<body>

    <script>
        $(document).ready(function () {

            $("#btn-search").on("click", function() {
                doSearch();
            });

            $("#btn-clear").on("click", function() {
                $("#startDate").val("");
                $("#endDate").val("");
                $("#title").val("");
                $("#status").val("");
            });
        });

        function doSearch(page = 0) {

            const startDate = $('#startDate').val();
            const endDate = $('#endDate').val();

            const requestDto = {
                rvTitle: $('#title').val() || null,
                rvStartDt: startDate ? startDate + 'T00:00:00' : null,
                rvEndDt: endDate ? endDate + 'T23:59:59' : null,
                rvStatus: $('#status').val() || null
            };

            $.ajax({
                url: '/admin/review/api/list.do?page=' + page,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestDto),
                success: function (html) {
                    $('#review-list').replaceWith(html);
                },
                error: function (xhr) {

                    const response = xhr.responseJSON;

                    if (response && response.message) {
                        alert(response.message);
                    } else {
                        alert('서버 오류가 발생했습니다.');
                    }
                }
            });
        }
    </script>

    <div th:replace="~{admin/header :: header}"></div>

    <!-- =========================================
        Main
    ========================================== -->

    <main class="container">

        <!-- Page Title -->

        <section class="page">

            <div class="page-title">

                <div class="title-left">

                    <img src="/admin/images/icon_review.png" alt="" class="title-icon">

                    <h2>리뷰관리</h2>

                </div>

            </div>

            <!-- 검색 영역 -->
            <div class="search-box">

                <div class="search-item">
                    <label for="startDate">노출일자</label>

                    <div class="date-wrap">
                        <input type="date" id="startDate" name="startDate">
                        <span>~</span>
                        <input type="date" id="endDate" name="endDate">
                    </div>
                </div>

                <div class="search-item">
                    <label for="title">제목</label>
                    <input type="text"
                           id="title"
                           name="searchName"
                           placeholder="제목을 입력하세요">
                </div>

                <div class="search-item">
                    <label for="status">상태</label>
                    <select id="status" name="searchStatus">
                        <option value="">전체</option>
                        <option value="02">노출중</option>
                        <option value="04">숨김</option>
                    </select>
                </div>

                <button type="button" class="btn-search" id="btn-search">
                    검색
                </button>

                <button type="button" class="btn-search" id="btn-clear">
                    초기화
                </button>

            </div>

            <!-- Table -->
            <div id="review-list" th:fragment="review-list">
                <div class="table-wrap">

                    <table class="table-list">

                        <colgroup>

                            <col style="width:80px;">
                            <col>
                            <col>
                            <col>
                            <col>
                            <col>
                            <col>

                        </colgroup>

                        <thead>

                            <tr>

                                <th>번호</th>
                                <th>미리보기</th>
                                <th>제목</th>
                                <th>플랫폼</th>
                                <th>등록일</th>
                                <th>노출</th>
                                <th>순서</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="review, stat : ${reviewList.content}">
                                <td th:text="${reviewList.page * reviewList.size + stat.index + 1}">1</td>
                                <td class="subject">
                                    <a th:href="@{/admin/review/view.do/{puId}(puId=${review.rvId})}"
                                       class="align-center">
                                        <img
                                                th:if="${review.rvAfId != null}"
                                                th:src="@{/file/api/getImageSource.do/{afId}(afId=${review.rvAfId})}"
                                                alt="리뷰 이미지" class="review_preview">
                                    </a>
                                </td>
                                <td
                                        class="nowrap"
                                        th:text="${review.rvTitle}">리뷰 제목</td>
                                <td th:text="${review.rvPlatform}">리뷰 플랫폼</td>
                                <td th:text="${#temporals.format(review.regDt, 'yyyy-MM-dd')}">2026-07-24</td>
                                <td>
                                    <span th:switch="${review.rvStatus}">
                                        <span th:case="'02'" class="badge badge-blue">노출중</span>
                                        <span th:case="'04'" class="badge badge-gray">숨김</span>
                                    </span>
                                </td>
                                <td th:text="${review.rvOrder}">1</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <!-- Bottom -->

                <div class="page-bottom">

                    <!-- Pagination -->

                    <nav class="pagination" th:if="${reviewList.totalPages > 0}">

                        <a href="#"
                           class="page-btn first"
                           th:classappend="${reviewList.first} ? ' disabled'"
                           th:onclick="|doSearch(0); return false;|">
                            &laquo;
                        </a>

                        <a href="#"
                           class="page-btn prev"
                           th:classappend="${reviewList.first} ? ' disabled'"
                           th:onclick="|doSearch(${reviewList.page - 1}); return false;|">
                            &lsaquo;
                        </a>

                        <th:block th:with="startPage=${(reviewList.page / 5) * 5},
                        endPage=${T(java.lang.Math).min(startPage + 4, reviewList.totalPages - 1)}">

                            <a href="#"
                               class="page-number"
                               th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
                               th:classappend="${pageNum == reviewList.page} ? ' active'"
                               th:text="${pageNum + 1}"
                               th:onclick="|doSearch(${pageNum}); return false;|">
                            </a>

                        </th:block>

                        <a href="#"
                           class="page-btn next"
                           th:classappend="${reviewList.last} ? ' disabled'"
                           th:onclick="|doSearch(${reviewList.page + 1}); return false;|">
                            &rsaquo;
                        </a>

                        <a href="#"
                           class="page-btn last"
                           th:classappend="${reviewList.last} ? ' disabled'"
                           th:onclick="|doSearch(${reviewList.totalPages - 1}); return false;|">
                            &raquo;
                        </a>

                    </nav>

                    <div class="btn-area">

                        <button
                                type="button"
                                class="btn btn-primary"
                                onclick="location.href='/admin/review/write.do'">

                            새 리뷰 등록

                        </button>

                    </div>

                </div>
            </div>

        </section>

    </main>

</body>

</html>
