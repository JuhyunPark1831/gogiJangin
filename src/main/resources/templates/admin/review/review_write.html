<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title></title>

    <link rel="stylesheet" href="/admin/css/style.css">

</head>

<body>

    <script>
        $(document).ready(function () {

            $("#btn-save").on("click", function() {
                doSave();
            });

            $("#btn-cancel").on("click", function() {
                location.href = "/admin/review/list.do";
            });

            $("#reviewImage").on("change", function() {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    $("#imagePreview")
                        .attr("src", e.target.result)
                        .show();

                    $(".upload-icon").hide();
                    $(".upload-area strong").hide();
                    $(".upload-area p").hide();
                    $(".btn-upload").hide();
                }

                reader.readAsDataURL(file);
            });
        });

        function doSave() {

            const rvTitle = $('#rvTitle');
            const rvPlatform = $('#rvPlatform');
            const rvImage = $('#reviewImage');
            const rvStatus = $('#rvStatus');
            const rvOrder = $('#rvOrder');

            if (!rvTitle.val()) {
                alert("제목을 입력해주세요");
                rvTitle.focus();
                return;
            }

            if (!rvPlatform.val()) {
                alert("플랫폼을 선택해주세요");
                rvPlatform.focus();
                return;
            }

            if (rvImage[0].files.length === 0) {
                alert("이미지를 등록해주세요");
                rvImage.focus();
                return;
            }

            if (!rvStatus.val()) {
                alert("노출여부를 선택해주세요");
                rvStatus.focus();
                return;
            }

            if (!rvOrder.val()) {
                alert("정렬순서를 입력해주세요");
                rvOrder.focus();
                return;
            }

            const formData = new FormData();
            const imageFile = rvImage[0].files[0];

            formData.append('rvTitle', rvTitle.val());
            formData.append('rvPlatform', rvPlatform.val());
            formData.append('rvImage', imageFile);
            formData.append('rvStatus', rvStatus.val());
            formData.append('rvOrder', rvOrder.val());

            $.ajax({
                url: '/admin/review/api/addReview.do',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,

                success: function () {
                    alert("리뷰가 등록되었습니다.");
                    location.href = "/admin/review/list.do";
                },

                error: function (xhr) {

                    const response = xhr.responseJSON;

                    if (response && response.message) {
                        alert(response.message);
                    } else {
                        alert('서버 오류가 발생했습니다.');
                    }
                }
            });
        }
    </script>

    <div th:replace="~{admin/header :: header}"></div>

    <!-- =========================================
        Main
    ========================================== -->

    <main class="container">

        <!-- Page Title -->

        <section class="page">

            <div class="page-title">

                <div class="title-left">

                    <img src="/admin/images/icon_review.png" alt="" class="title-icon">

                    <h2>리뷰관리</h2>

                </div>

            </div>


            <!-- Form -->

            <form>

                <div class="form-table">

                    <table>

                        <colgroup>

                            <col style="width:190px;">
                            <col>

                        </colgroup>

                        <tbody>

                            <!-- 제목 -->

                            <tr>

                                <th>
                                    제목
                                </th>

                                <td>

                                    <input
                                        type="text"
                                        class="form-input"
                                        id="rvTitle"
                                        placeholder="제목을 입력하세요.">

                                </td>

                            </tr>

                            <tr>

                                <th>
                                    플랫폼
                                </th>

                                <td>
                                    <select class="form-select" id="rvPlatform">

                                        <option value="">플랫폼 선택</option>

                                        <option value="네이버">네이버</option>

                                        <option value="배달의민족">배달의민족</option>

                                        <option value="쿠팡이츠">쿠팡이츠</option>

                                        <option value="요기요">요기요</option>

                                        <option value="땡겨요">땡겨요</option>

                                        <option value="인스타그램">인스타그램</option>

                                        <option value="페이스북">페이스북</option>

                                        <option value="블로그">블로그</option>

                                        <option value="기타">기타</option>

                                    </select>
                                    

                                </td>

                            </tr>

                            <!-- 이미지 -->

                            <tr>

                                <th>
                                    파일 이미지 업로드
                                </th>

                                <td>

                                    <div class="upload-box">

                                        <input
                                            type="file"
                                            id="reviewImage"
                                            hidden>

                                        <label
                                            for="reviewImage"
                                            class="upload-area">

                                            <img
                                                    id="imagePreview"
                                                    src=""
                                                    alt="이미지 미리보기"
                                                    style="display: none;">

                                            <div class="upload-icon">

                                                +

                                            </div>

                                            <strong>

                                                이미지를 업로드 하세요

                                            </strong>

                                            <p>

                                                (JPG, PNG, max 5MB)

                                            </p>

                                            <span class="btn-upload">

                                                이미지 선택

                                            </span>

                                        </label>

                                    </div>

                                </td>

                            </tr>

                            <!-- 노출기간 -->

                            <tr>

                                <th>
                                    노출 여부
                                </th>

                                <td>

                                    <select class="form-select" id="rvStatus">

                                        <option value="02">노출</option>

                                        <option value="04">숨김</option>

                                    </select>                                    

                                </td>

                            </tr>

                            <tr>

                                <th>
                                    정렬 순서
                                </th>

                                <td style="display: flex;">

                                     <input
                                        type="number"
                                        class="form-input"
                                        id="rvOrder"
                                        min="1"
                                        step="1"
                                        value="1"
                                        style="width: 220px;">

                                    <div style="align-content: center;color: #a8a8a8;margin-left: 10px;">정렬순서가 같은 리뷰들은 최근 등록한 순으로 표출됩니다</div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- Bottom -->

                <div class="form-btn">

                    <button
                        type="button"
                        class="btn btn-gray"
                        id="btn-cancel">

                        취소하기

                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="btn-save">

                        등록하기

                    </button>

                </div>

            </form>
            


        </section>

    </main>

</body>

</html>
